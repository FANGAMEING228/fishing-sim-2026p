<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПІКСЕЛЬНА РИБАЛКА</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#050c10;overflow:hidden;overscroll-behavior:none;}
  body{cursor:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;}
  #cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a1a20;touch-action:none;}
  #fsBtn{
    position:fixed;top:8px;right:8px;z-index:20;width:34px;height:34px;
    border:2px solid #2c5a6a;border-radius:6px;background:rgba(10,25,32,0.78);
    color:#e8f0f0;font:16px monospace;line-height:30px;text-align:center;padding:0;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
  }
  #fsBtn:active{background:rgba(232,162,58,0.85);color:#1a1206;}
  #rotateHint{
    position:fixed;inset:0;z-index:30;display:none;
    background:rgba(5,12,16,0.94);color:#e8f0f0;
    align-items:center;justify-content:center;text-align:center;
    font:14px/1.5 monospace;padding:20px;box-sizing:border-box;
  }
  #rotateHint .ico{font-size:40px;display:block;margin-bottom:10px;}
</style>
</head>
<body>
<canvas id="cv" width="320" height="240"></canvas>
<button id="fsBtn" title="На весь екран">⛶</button>
<div id="rotateHint"><div><span class="ico">⟳</span>ПОВЕРНІТЬ ТЕЛЕФОН<br>ГОРИЗОНТАЛЬНО</div></div>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ================================================================
   ПІКСЕЛЬНА РИБАЛКА — частина 1: шрифт, канвас, спрайти, звук
   ================================================================ */
const VW = 320, VH = 240;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let view = { sc: 1, ox: 0, oy: 0 };
function resize() {
  const ww = innerWidth, wh = innerHeight;
  let sc = Math.min(ww / VW, wh / VH);
  if (sc >= 1) sc = Math.max(1, Math.floor(sc * 2) / 2); // пів-кроки для великих екранів
  view.sc = sc;
  view.ox = (ww - VW * sc) / 2;
  view.oy = (wh - VH * sc) / 2;
  cv.style.width = (VW * sc) + 'px';
  cv.style.height = (VH * sc) + 'px';
  cv.style.left = view.ox + 'px';
  cv.style.top = view.oy + 'px';
}
addEventListener('resize', resize);
resize();

/* ---------------- НА ВЕСЬ ЕКРАН (Fullscreen API) ---------------- */
const fsBtn = document.getElementById('fsBtn');
function isFS() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updFsBtn() { fsBtn.textContent = isFS() ? '×' : '⛶'; }
function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (!isFS()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  } catch (e) {}
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => { updFsBtn(); resize(); });
document.addEventListener('webkitfullscreenchange', () => { updFsBtn(); resize(); });
updFsBtn();

/* ---------------- МОБІЛЬНЕ: підказка повернути екран ---------------- */
const rotateHint = document.getElementById('rotateHint');
const isTouchDevice = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function updOrientHint() {
  const portrait = innerHeight > innerWidth;
  rotateHint.style.display = (isTouchDevice && portrait) ? 'flex' : 'none';
}
addEventListener('resize', updOrientHint);
addEventListener('orientationchange', updOrientHint);
updOrientHint();

function textW(s, sc) { return String(s).length * 6 * sc - sc; }
function drawText(s, x, y, sc, col, align, shadow) {
  s = String(s).toUpperCase();
  if (align === 'center') x -= Math.round(textW(s, sc) / 2);
  else if (align === 'right') x -= textW(s, sc);
  x = Math.round(x); y = Math.round(y);
  const paint = (px, py, c) => {
    ctx.fillStyle = c;
    for (const ch of s) {
      const g = FONT[ch];
      if (g) {
        const rows = g.split(',');
        for (let r = 0; r < 7; r++) {
          const row = rows[r];
          for (let i = 0; i < 5; i++) if (row[i] === '1') ctx.fillRect(px + i * sc, py + r * sc, sc, sc);
        }
      }
      px += 6 * sc;
    }
  };
  if (shadow !== false) paint(x + sc, y + sc, '#0a1216');
  paint(x, y, col);
}

/* ---------------- утиліти ---------------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (x0, y0, x1, y1) => Math.hypot(x1 - x0, y1 - y0);
function wpick(obj) {
  let tot = 0; for (const k in obj) tot += obj[k];
  let r = Math.random() * tot;
  for (const k in obj) { r -= obj[k]; if (r < 0) return k; }
  return Object.keys(obj)[0];
}
function makeCv(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function P(g, col, x, y, w, h) { g.fillStyle = col; g.fillRect(x, y, w || 1, h || 1); }
// центр-N blit (піксельний, без згладжування)
function blit(img, x, y, sc, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) {
    ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1);
    ctx.drawImage(img, -Math.round(img.width * sc / 2), -Math.round(img.height * sc / 2), Math.round(img.width * sc), Math.round(img.height * sc));
    ctx.restore();
  } else {
    ctx.drawImage(img, x - Math.round(img.width * sc / 2), y - Math.round(img.height * sc / 2), Math.round(img.width * sc), Math.round(img.height * sc));
  }
}
function pixLine(x0, y0, x1, y1, sag, col) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + sag;
  const d = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(6, Math.min(90, d / 2 | 0));
  ctx.fillStyle = col;
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    const x = u * u * x0 + 2 * u * t * mx + t * t * x1;
    const y = u * u * y0 + 2 * u * t * my + t * t * y1;
    ctx.fillRect(x | 0, y | 0, 1, 1);
  }
}
// кільце з пікселів (для кіл на воді)
const circleCache = {};
function circlePts(r) {
  r = Math.round(r);
  if (circleCache[r]) return circleCache[r];
  const pts = [];
  for (let x = -r; x <= r; x++) {
    const y = Math.round(Math.sqrt(r * r - x * x));
    pts.push([x, y], [x, -y]);
  }
  circleCache[r] = pts;
  return pts;
}

function scheduleStand(kind) {
  const st = S.stand[kind]; if (!st) return;
  const bait = BAITS[S.tIdxBait || 0] || BAITS[0];
  const prefMap = BAIT_PREF[bait.id] || BAIT_PREF.worm;
  const w = {};
  for (const id in prefMap) w[id] = prefMap[id];

  st.nextFish = fishById(wpick(w));

function startStandNib(st) {
  const n = 1 + (Math.random() * 3 | 0);
  const seq = [];
  let t = 0.2;
  for (let i = 0; i < n; i++) { seq.push(t); t += rnd(0.5, 1.1); }

}
function hookStand(kind) {
  const st = S.stand[kind];
  if (!st || !st.bite || !st.float) return;
  if (G && G.fight) return; // спочатку виважуй поточну рибу
  const spot = { x: st.float.x, y: st.rigY };
  addSplash(spot.x, spot.y, true); addRipple(spot.x, spot.y, 12);
  st.bite = null; st.nib = null;

function updStand(kind, dt) {
  const st = S.stand[kind]; if (!st) return;
  const cfg = STANDS[kind], isF = kind === 'feeder';
  st.t += dt;
  // вершинка гнеться від потяжок/покльовки/виважування
  let target = cfg.ang;
  if (G && G.fight && G.fight.src === kind) target -= 0.10 + 0.10 * (G.fight.T / 100);
  else if (st.bite) target -= 0.14 + Math.sin(st.t * 16) * 0.05;
  else if (st.nib) target -= 0.05 + Math.sin(st.t * 30) * 0.03;
  st.dispAng += (target - st.dispAng) * Math.min(1, dt * 10);
  if (st.phase === 'fly') {
    st.flyT += dt / st.dur;
    if (st.flyT >= 1) {
      addSplash(st.tx, st.ty, false); addRipple(st.tx, st.ty, 10); SND.splash();
      st.float = { x: st.tx, baseX: st.tx, baseY: st.ty, y: st.ty, tilt: 0, dipT: 0, t: 0 };
      st.baitY = st.ty + 2;
      st.sinkT = isF ? 1.8 : 1.1;
      st.phase = 'sink';
    }
  } else if (st.phase === 'sink') {
    st.float.t += dt;
    if (isF) st.float.y += (st.float.baseY - st.float.y) * Math.min(1, dt * 2.0);
    else st.float.y = st.float.baseY + Math.sin(st.float.t * 2.2) * 1;
    st.baitY += (st.rigY - st.baitY) * Math.min(1, dt * 2.2);
    st.sinkT -= dt;
    if (st.sinkT <= 0) { st.baitY = st.rigY; st.float.y = st.float.baseY; st.phase = 'wait'; st.t = 0; scheduleStand(kind); }
  } else if (st.phase === 'wait') {
    const fl = st.float;
    if (st.bite) {
      // покльовка: поплавок пішов під воду / квівертип тіпає
      st.bite.t -= dt;
      // автоловля: сама підсікає на ставній вудці (працює з однією і з двома)
      if (autoActive()) {
        st.bite.autoT = (st.bite.autoT || 0) + dt;
        if (st.bite.autoT > 1.2 && !G.fight) { hookStand(kind); return; }
      }
      if (isF) { if (Math.random() < dt * 3) addRipple(fl.x, 86, 5); }
      else { fl.y = fl.baseY + 7; fl.tilt = 0.55; fl.x -= dt * 2; if (Math.random() < dt * 3) addRipple(fl.x, fl.baseY, 5); }
      if (st.bite.t <= 0) {
        fl.y = fl.baseY; fl.x = fl.baseX; fl.tilt = 0;
        addSplash(fl.x, isF ? 88 : fl.baseY, false);
        setMsg('НА ' + (isF ? 'ФІДЕРІ' : 'ПОПЛАВОЧНІ') + ' РИБА ПІШЛА...', '#ffb050', 1.6);
        st.bite = null; st.nib = null;
        scheduleStand(kind);
      }
    } else if (st.nib) {
      const nb = st.nib;
      nb.t += dt;
      if (nb.done < nb.seq.length && nb.t >= nb.seq[nb.done]) {
        nb.done++;
        SND.nibble();
        if (isF) addRipple(fl.x, 86, 4); else fl.dipT = 0.25;
      }
      if (isF) fl.y = fl.baseY + Math.sin(st.t * 2) * 0.6;
      else {
        fl.dipT = Math.max(0, fl.dipT - dt);
        fl.y = fl.baseY + (fl.dipT > 0 ? 1.5 : 0) + Math.sin(fl.t * 2) * 1;
        fl.tilt = fl.dipT > 0 ? 0.22 * (nb.done % 2 ? 1 : -1) : 0;
      }
      if (nb.done >= nb.seq.length && nb.t > nb.seq[nb.seq.length - 1] + 0.55) {
        if (Math.random() < 0.55) { st.bite = { t: 3.5 }; st.nib = null; SND.bite(); }
        else { st.nib = null; scheduleStand(kind); }
      }
    } else {
      fl.t += dt;
      fl.y = fl.baseY + Math.sin(fl.t * 2) * 1;
      fl.tilt = 0;
      st.biteTimer -= dt;
      if (st.biteTimer <= 0) startStandNib(st);
    }
  }
}

const NET = { peer: null, conn: null, role: null, roomId: '', status: 'idle', err: '', oppLures: null, mode: null, pendMode: null };
function netModeName(m) { return m === 'comp' ? 'ЩУКОЛОВ' : 'ПРОСТО РИБАЛКА'; }
function randRoom() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
const TRANSLIT = { 'А':'A','Б':'B','В':'V','Г':'H','Ґ':'G','Д':'D','Е':'E','Є':'YE','Ж':'ZH','З':'Z','И':'Y','І':'I','Ї':'YI','Й':'Y','К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R','С':'S','Т':'T','У':'U','Ф':'F','Х':'KH','Ц':'TS','Ч':'CH','Ш':'SH','Щ':'SHCH','Ь':'','Ю':'YU','Я':'YA','Ы':'Y','Э':'E','Ё':'YO','Ъ':'' };
function normalizeRoom(s) {
  s = String(s || '').toUpperCase().replace(/./g, ch => TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch).replace(/[^A-Z0-9]/g, '');
  return (s.length >= 3 && s.length <= 12) ? s : '';
}
function netHost(custom) {
  if (typeof Peer === 'undefined') { NET.status = 'error'; NET.err = 'НЕМАЄ З’ЄДНАННЯ З ІНТЕРНЕТОМ'; return; }

  try {
    NET.peer = new Peer(undefined, { debug: 0 });
    NET.peer.on('open', () => {
      const c = NET.peer.connect('pixfish-' + NET.roomId, { reliable: true });
      NET.conn = c;
      c.on('open', () => { NET.status = 'connected'; });
      c.on('data', netOnData);
      c.on('close', netOnClose);

    setMsgGlobal('ДРУГ НАДІСЛАВ: ' + l.n1 + ' ' + l.n2, '#7be08a');

}

function btn(x, y, w, h, label, fn, sc, dis, sel) {
  sc = sc || 1;
  const hov = !dis && pt.x >= x && pt.x < x + w && pt.y >= y && pt.y < y + h;
  ctx.fillStyle = dis ? '#122830' : hov ? '#e8a23a' : sel ? '#1d4a2c' : '#1b3a46';

  ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);

  if (!dis) clicks.push({ x, y, w, h, fn });
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,20,28,0.92)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#3a6a78'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = '#0a161c'; ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillStyle = '#162e38'; ctx.fillRect(x + 1, y + 1, w - 2, 1);
}

function zoneOf(y) { return y < 135 ? 0 : y < 172 ? 1 : 2; }
function zoneOk(sp, lz) {
  if (sp.id === 'catfish' || sp.id === 'burbot' || sp.id === 'sheatfish') return lz === 2;
  return Math.abs(sp.zone - lz) <= 1;
}
function wrapName(n, max) {
  max = max || 8;
  if (n.length <= max) return [n];
  const mid = Math.ceil(n.length / 2);
  return [n.slice(0, mid), n.slice(mid)];
}

function isUnlocked(listName, id) { return (S[listName] || []).includes(id); }
function tryBuy(listName, id, price) {
  if (isUnlocked(listName, id)) return true;
  if (S.money < price) { setMsgGlobal('НЕ ВИСТАЧАЄ ГРОШЕЙ!', '#ff5a4a'); SND.snap && SND.snap(); return false; }
  S.money -= price; S[listName].push(id); save(); SND.sell(); return true;
}

const SHOP_TABS = ['СИЛІК', 'ВУДКИ', 'ЛІСКА', 'ПОПЛАВ', 'ПІНКОД'];
function drawShop() {
  ctx.fillStyle = 'rgba(4,12,18,0.72)'; ctx.fillRect(0, 0, VW, VH);
  clicks.push({ x: 0, y: 0, w: VW, h: VH, fn: () => {} });

  drawText('$' + S.money, 306, 20, 1, '#ffd54a', 'right');
  SHOP_TABS.forEach((t, i) => {
    btn(14 + i * 58, 32, 56, 14, t, () => { S.shopTab = i; S.shopPage2 = 0; SND.ui(); }, 1, false, (S.shopTab || 0) === i);
  });
  const rows = [];
  const tab = S.shopTab || 0;
  if (tab === 0) {
    LURES.forEach((l, i) => rows.push({
      name: l.n1 + ' ' + l.n2,
      hint: l.hint + (S.mode === 'spin' ? '' : ' (ЛИШЕ СПІНІНГ)'),
      right: (l.free || isUnlocked('unlockedLures', l.id)) ? (S.mode === 'spin' && (S.tIdxSpin || 0) === i ? 'ОБРАНО' : 'Є') : '$' + l.price,
      dim: !(l.free || isUnlocked('unlockedLures', l.id)),
      fn: () => {
        if (l.free || isUnlocked('unlockedLures', l.id)) {
          if (S.mode === 'spin') { S.tIdx = i; S.tIdxSpin = i; setMsgGlobal('ОБРАНО: ' + l.n1 + ' ' + l.n2, '#7be08a'); SND.ui(); }
          else setMsgGlobal('СИЛІКОНКИ - ДЛЯ СПІНІНГА', '#8aa8b0');
        } else if (tryBuy('unlockedLures', l.id, l.price)) {
          if (S.mode === 'spin') { S.tIdx = i; S.tIdxSpin = i; }
          setMsgGlobal('КУПЛЕНО: ' + l.n1 + ' ' + l.n2, '#7be08a');
        }
      }
    }));
  } else if (tab === 1) {
    const fed = isUnlocked('unlockedModes', 'feeder');
    rows.push({
      name: 'ФІДЕРНА ВУДКА (3-Я ВУДКА)', hint: 'ДНО, КЛЬОВ 2-4 ХВ, ВЕЛИКА РИБА',
      right: fed ? (S.mode === 'feeder' ? 'ОБРАНО' : 'ВЗЯТИ') : '$300',
      dim: !fed,
      fn: () => {
        if (fed) { if (S.scr === 'game') selectMode('feeder'); else setMsgGlobal('ФІДЕР - КНОПКА ЗНИЗУ В ГРІ', '#8aa8b0'); }
        else if (tryBuy('unlockedModes', 'feeder', 300)) setMsgGlobal('ФІДЕР КУПЛЕНО! КНОПКА ЗНИЗУ', '#7be08a');
      }
    });
    RODS.forEach((r, i) => rows.push({
      name: r.name, hint: r.hint,
      right: (r.free || isUnlocked('unlockedRods', r.id)) ? ((S.rodIdx || 0) === i ? 'ОБРАНО' : 'ВЗЯТИ') : '$' + r.price,
      dim: !(r.free || isUnlocked('unlockedRods', r.id)),
      fn: () => {
        if (r.free || isUnlocked('unlockedRods', r.id)) { S.rodIdx = i; save(); SND.ui(); }
        else if (tryBuy('unlockedRods', r.id, r.price)) { S.rodIdx = i; save(); }
      }
    }));
  } else if (tab === 2) {
    LINES.forEach((l, i) => rows.push({
      name: l.name, hint: l.hint,
      right: (l.free || isUnlocked('unlockedLines', l.id)) ? ((S.lineIdx || 0) === i ? 'ОБРАНО' : 'ВЗЯТИ') : '$' + l.price,
      dim: !(l.free || isUnlocked('unlockedLines', l.id)),
      fn: () => {
        if (l.free || isUnlocked('unlockedLines', l.id)) { S.lineIdx = i; save(); SND.ui(); }
        else if (tryBuy('unlockedLines', l.id, l.price)) { S.lineIdx = i; save(); }
      }
    }));
  } else if (tab === 3) {
    FLOATS.forEach((f) => rows.push({
      name: 'ПОПЛАВОК ' + f.name, hint: 'КАСТОМНИЙ ВИД',
      right: (f.free || isUnlocked('unlockedFloats', f.id)) ? (S.floatId === f.id ? 'ОБРАНО' : 'ВЗЯТИ') : '$' + f.price,
      dim: !(f.free || isUnlocked('unlockedFloats', f.id)),
      fn: () => {
        if (f.free || isUnlocked('unlockedFloats', f.id)) { S.floatId = f.id; rebuildFloat(); save(); SND.ui(); }
        else if (tryBuy('unlockedFloats', f.id, f.price)) { S.floatId = f.id; rebuildFloat(); save(); }
      }
    }));
    rows.push({
      name: 'СВІЙ КОЛІР (РЕДАКТОР)', hint: 'Повністю кастомний поплавок',
      right: isUnlocked('unlockedFloats', 'custom') ? (S.floatId === 'custom' ? 'ОБРАНО' : 'ВЗЯТИ') : '$150',
      dim: !isUnlocked('unlockedFloats', 'custom'),
      fn: () => {
        if (isUnlocked('unlockedFloats', 'custom')) { S.floatId = 'custom'; rebuildFloat(); save(); S.floatEditOpen = true; SND.ui(); }
        else if (tryBuy('unlockedFloats', 'custom', 150)) { S.floatId = 'custom'; rebuildFloat(); save(); S.floatEditOpen = true; }
      }
    });
  }
  if (tab === 4) { drawPinTab(); return; }
  const perPage = 7;
  const pages = Math.max(1, Math.ceil(rows.length / perPage));
  S.shopPage2 = clamp(S.shopPage2 || 0, 0, pages - 1);
  rows.slice(S.shopPage2 * perPage, S.shopPage2 * perPage + perPage).forEach((r, i) => {
    const y = 52 + i * 19, w = 292, x = 14;
    const hov = pt.x >= x && pt.x < x + w && pt.y >= y && pt.y < y + 18;
    panel(x, y, w, 18);
    if (hov) { ctx.fillStyle = 'rgba(255,213,74,0.12)'; ctx.fillRect(x + 1, y + 1, w - 2, 16); }
    drawText(r.name, x + 4, y + 2, 1, r.dim ? '#7a8a90' : '#e8f0f0');
    drawText(r.hint, x + 4, y + 10, 1, '#5a747e');
    drawText(r.right, x + w - 4, y + 6, 1, r.dim ? '#ffd54a' : '#6ac86a', 'right');
    clicks.push({ x, y, w, h: 18, fn: r.fn });
  });
  if (pages > 1) {
    btn(14, 192, 16, 14, '<', () => { S.shopPage2 = clamp(S.shopPage2 - 1, 0, pages - 1); SND.ui(); }, 1);
    drawText((S.shopPage2 + 1) + '/' + pages, 160, 195, 1, '#8aa8b0', 'center');
    btn(294, 192, 16, 14, '>', () => { S.shopPage2 = clamp(S.shopPage2 + 1, 0, pages - 1); SND.ui(); }, 1);
  }
  btn(122, 208, 76, 18, 'ЗАКРИТИ', () => { S.shopOpen = false; SND.ui(); }, 1);
}

    keys.forEach((kk, i) => {
      const col = i % 3, row = (i / 3) | 0;
      btn(67 + col * 64, 90 + row * 22, 58, 18, kk, () => {

        else if ((S.pinBuf || '').length < 4) { S.pinBuf = (S.pinBuf || '') + kk; SND.nibble(); }
      }, 1);
    });
    btn(110, 182, 100, 18, 'УВІЙТИ', () => {

    drawText(_pinMsg.text, 160, 200, 1, _pinMsg.col, 'center');

}

/* ---------------- ОВЕРЛЕЙ: СКЛАД РИБИ ---------------- */

  drawText('РИБ: ' + tot + '/' + MAX_FISH + '  ' + kgs.toFixed(1) + 'КГ  НА $' + sum, 298, 28, 1, tot >= MAX_FISH ? '#ff8a4a' : '#c8d8dc', 'right');

    if (nm[1]) drawText(nm[1], x + 32, y + 32, 1, k ? '#e8f0f0' : '#4a626c', 'center');

  }
  btn(22, 188, 138, 26, 'ПРОДАТИ ВСЕ: $' + sum, () => {

  btn(168, 188, 138, 26, S.scr === 'game' ? 'ЗАКРИТИ (I)' : 'ЗАКРИТИ', () => { S.invOpen = false; SND.ui(); }, 1);
}

/* ---------------- КУРСОР ---------------- */
function drawCursor() {
  if (pt.x < 0) return;
  const x = Math.round(pt.x), y = Math.round(pt.y);
  ctx.fillStyle = '#0a1216';
  ctx.fillRect(x - 4, y, 9, 1); ctx.fillRect(x, y - 4, 1, 9);
  ctx.fillStyle = '#f4f8fc';
  ctx.fillRect(x - 3, y, 7, 1); ctx.fillRect(x, y - 3, 1, 7);
  ctx.fillStyle = '#ffd54a';
  ctx.fillRect(x, y, 1, 1);
}

/* ---------------- ВВЕДЕННЯ ---------------- */
function toVirtual(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / view.sc, y: (e.clientY - r.top) / view.sc };
}
cv.addEventListener('mousemove', e => { const p = toVirtual(e); pt.x = p.x; pt.y = p.y; });
cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  ac();
  const p = toVirtual(e); pt.x = p.x; pt.y = p.y;
  mouseHeld = true;
  // спершу кнопки (верхні шари в кінці списку)
  for (let i = clicks.length - 1; i >= 0; i--) {
    const c = clicks[i];
    if (pt.x >= c.x && pt.x < c.x + c.w && pt.y >= c.y && pt.y < c.y + c.h) { c.fn(); return; }
  }
  if (S.scr === 'game' && !S.paused && !S.invOpen && !S.shopOpen && !S.tradeOpen && !S.floatEditOpen) gameClick(pt.x, pt.y);
});
addEventListener('mouseup', () => { mouseHeld = false; });
cv.addEventListener('mouseleave', () => { pt.x = -99; pt.y = -99; mouseHeld = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => {
  e.preventDefault(); ac();
  const t = e.touches[0];
  const p = toVirtual(t); pt.x = p.x; pt.y = p.y;
  mouseHeld = true;
  for (let i = clicks.length - 1; i >= 0; i--) {
    const c = clicks[i];
    if (pt.x >= c.x && pt.x < c.x + c.w && pt.y >= c.y && pt.y < c.y + c.h) { c.fn(); return; }
  }
  if (S.scr === 'game' && !S.paused && !S.invOpen && !S.shopOpen && !S.tradeOpen && !S.floatEditOpen) gameClick(pt.x, pt.y);
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  if (t) { const p = toVirtual(t); pt.x = p.x; pt.y = p.y; }
}, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); mouseHeld = false; pt.x = -99; pt.y = -99; }, { passive: false });
cv.addEventListener('touchcancel', e => { mouseHeld = false; pt.x = -99; pt.y = -99; }, { passive: true });
addEventListener('blur', () => { mouseHeld = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) mouseHeld = false; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // на ПК цифри 1-3 змінюють вудку так само, як кнопки знизу
  if (S.scr === 'game' && !S.paused && (k === '1' || k === '2' || k === '3')) {
    selectMode(k === '1' ? 'float' : k === '2' ? 'feeder' : 'spin');
    return;
  }
  if (S.scr !== 'game') return;
  if (k === 'escape') {
    if (S.floatEditOpen) S.floatEditOpen = false;
    else if (S.shopOpen) S.shopOpen = false;
    else if (S.tradeOpen) S.tradeOpen = false;
    else if (S.invOpen) { S.invOpen = false; }
    else S.paused = !S.paused;
    SND.ui();
  }
  if ((k === 'i' || k === 'і' || k === 'ш') && !S.shopOpen && !S.tradeOpen && !S.floatEditOpen) { S.invOpen = !S.invOpen; SND.ui(); }
});

/* ================================================================
   Частина 3: геймплей — закид, проводки, покльовки, виважування
   ================================================================ */
const PIV = { x: 297, y: 226 };          // точка, де рибалка тримає вудку
const WT = 86, WB = 212;                 // межі води для закидання
let rodAng = -2.3;

const G = {
  phase: 'idle', t: 0,
  fly: null, lure: null, float: null,
  rigY: 0, baitY: 0, sinkT: 0,
  biteTimer: 0, nextFish: null, nib: null, bite: null,
  chase: null, chaseCD: 1.5, strikeT: 0,
  fight: null, show: null,
  amb: [], ripples: [], parts: [],
  msg: null, pauseT: 0, reelT: 0, wig: 0, tipWig: 0
};

function startGame() {
  S.scr = 'game'; S.paused = false; S.invOpen = false; S.shopOpen = false; S.tradeOpen = false; S.floatEditOpen = false;
  // поплавочна/фідер, вибрана перед стартом, автоматично ставиться; в руки завжди спінінг
  const startStand = (S.mode === 'float' || S.mode === 'feeder') ? S.mode : null;
  S.mode = 'spin'; S.tIdx = S.tIdxSpin || 0;
  initGame();
  if (startStand) placeStand(startStand, true);
}
function initGame() {
  G.phase = 'idle'; G.fly = null; G.lure = null; G.float = null;
  G.bite = null; G.nib = null; G.chase = null; G.chaseCD = rnd(1, 2);
  G.fight = null; G.show = null; G.msg = null;
  G.spinBack = null; G.showSrc = null;
  G.amb = []; G.ripples = []; G.parts = [];
  G.pauseT = 0; G.reelT = 0; G.baitOn = true; G.tipWig = 0;
  spawnAmbient(6);
  setMsg(S.mode === 'spin' ? 'СИЛІКОНКА: ' + LURES[S.tIdx].n1 + ' ' + LURES[S.tIdx].n2 : 'НАЖИВКА: ' + BAITS[S.tIdx].name, '#ffd54a', 2.4);
}
function resetFishing() {
  G.phase = 'idle'; G.fly = null; G.lure = null; G.float = null;
  G.bite = null; G.nib = null; G.chase = null; G.fight = null; G.show = null;
  G.tipWig = 0;
  G.autoHold = false; G.autoHoldT = 0; G.autoCastT = 0; G.autoStrikeT = 0;
}

function setMsg(text, col, dur) { G.msg = { text, col: col || '#e8f0f0', t: dur || 2 }; }
function addRipple(x, y, max) { G.ripples.push({ x, y, r: 1, max: max || 8 }); }
function addSplash(x, y, big) {
  const n = big ? 11 : 6;
  for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rnd(-22, 22), vy: rnd(-52, -14), life: rnd(0.3, 0.55) });
}

const AMB_POOL = { ruff: 3, roach: 3, perch: 2, crucian: 2, rudd: 1, bream: 1, carp: 0.6, tench: 0.6, zander: 0.5, pike: 0.5, bleak: 2.5, chub: 1, trout: 0.6, asp: 0.4, burbot: 0.25, gudgeon: 2.5, vimba: 0.9, barbel: 0.5, sheatfish: 0.25, sturgeon: 0.12, goldfish: 0.08 };
function spawnAmbient(n) {
  for (let i = 0; i < n; i++) {
    G.amb.push({ sp: fishById(wpick(AMB_POOL)), x: rnd(10, 310), y: rnd(94, 202), dir: Math.random() < 0.5 ? -1 : 1, spd: rnd(4, 10), t: rnd(0, 9) });
  }
}
function updAmb(dt) {
  for (const a of G.amb) {
    a.t += dt;
    a.x += a.dir * a.spd * dt;
    a.y += Math.sin(a.t * 1.7) * 0.06;
    const ymax = a.x > 226 ? 166 : 204;
    if (a.y > ymax) a.y = ymax;
    if (a.y < 92) a.y = 92;
    if (a.x < -18 || a.x > 338) {
      a.dir *= -1;
      a.x = clamp(a.x, -17, 337);
      a.sp = fishById(wpick(AMB_POOL));
    }
    if (Math.random() < dt * 0.04) a.dir *= -1;
  }
}
function updFx(dt) {
  for (const r of G.ripples) r.r += dt * 13;
  G.ripples = G.ripples.filter(r => r.r < r.max);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 170 * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
}

function rodTipPos() {
  const rod = S.mode === 'float' ? ROD_FLOAT : (S.mode === 'feeder' ? ROD_FEEDER : ROD_SPIN);
  return { x: PIV.x + Math.cos(rodAng) * rod.len, y: PIV.y + Math.sin(rodAng) * rod.len };
}
function inWater(x, y) { return x >= 14 && x <= 308 && y >= WT - 4 && y <= WB + 6; }
function clampCast(x, y) {
  x = clamp(x, 14, 306); y = clamp(y, WT, WB);
  if (x > 226 && y > 172) y = 172;   // трава справа
  return { x, y };
}
function cast(x, y) {
  const c = clampCast(x, y);
  const tip = rodTipPos();
  const d = dist(tip.x, tip.y, c.x, c.y);
  G.fly = { sx: tip.x, sy: tip.y, tx: c.x, ty: c.y, t: 0, dur: 0.35 + Math.min(0.45, d / 650) };
  G.chase = null; G.float = null; G.lure = null; G.bite = null; G.nib = null;
  G.phase = 'fly';
  SND.cast();
}
function flyPos() {
  const f = G.fly, t = Math.min(1, f.t);
  const x = f.sx + (f.tx - f.sx) * t;
  const y = f.sy + (f.ty - f.sy) * t - Math.sin(Math.PI * t) * (14 + dist(f.sx, f.sy, f.tx, f.ty) * 0.06);
  return { x, y };
}
function landFly() {
  const f = G.fly;
  addSplash(f.tx, f.ty, false); addRipple(f.tx, f.ty, 10); SND.splash();
  G.fly = null;
  if (S.mode === 'float') {
    G.float = { x: f.tx, baseY: f.ty - 2, y: f.ty - 2, tilt: 0, t: 0, dipT: 0 };
    G.rigY = clamp(f.ty + 26, f.ty + 12, 206);
    G.baitY = f.ty + 2;
    G.sinkT = 1.1;
    G.phase = 'sinkBait';
    scheduleBite();
  } else if (S.mode === 'feeder') {
    // годівниця їде на дно
    G.rigY = clamp(Math.max(f.ty + 30, 190), 130, 206);
    G.float = { x: f.tx, baseY: G.rigY - 3, y: f.ty, tilt: 0, t: 0, dipT: 0 };
    G.baitY = f.ty + 4;
    G.sinkT = 1.8;
    G.phase = 'sinkBait';
    scheduleBite();
  } else {
    G.lure = { x: f.tx, y: f.ty };
    G.pauseT = 0; G.chaseCD = rnd(0.8, 1.6);
    G.phase = 'sink';
  }
}

/* ---------------- ПОПЛАВОЧНА: наживка, потяжки, покльовка ---------------- */
function scheduleBite() {
  const bait = BAITS[S.tIdx];
  const prefMap = BAIT_PREF[bait.id];
  const w = {};
  for (const id in prefMap) w[id] = prefMap[id];
  // фідер ловить з дна: донна риба частіше
  if (S.mode === 'feeder') { for (const id in w) { const sp = fishById(id); if (sp.zone === 2) w[id] *= 2.4; } }
  const id = wpick(w);
  G.nextFish = fishById(id);
  // поплавочна і фідер: перша покльовка через 2-4 хв після закиду
  G.biteTimer = 120 + Math.random() * 120;
  G.nib = null;
}
function startNibble() {
  const n = 1 + (Math.random() * 3 | 0);
  const seq = [];
  let t = 0.2;
  for (let i = 0; i < n; i++) { seq.push(t); t += rnd(0.5, 1.1); }
  G.nib = { seq, done: 0, t: 0 };
}
function hookFloat() {
  if (!G.bite) return;
  const spot = { x: G.float.x, y: G.rigY };
  addSplash(spot.x, spot.y, true); addRipple(spot.x, spot.y, 12);
  G.bite = null; G.nib = null; G.float = null;
  SND.hook();
  fightInit(G.nextFish, spot);
}
function tooEarly() {
  SND.early();
  setMsg('ЗАРАНО! РИБА ЗЛЯКАЛАСЯ', '#ffb050', 1.8);
  G.nib = null; G.bite = null;
  scheduleBite();
  G.biteTimer *= 1.7;
}

/* ---------------- СПІНІНГ: проводка, атака, підсічка ---------------- */
function tryChase(dt) {
  if (G.chase || !G.lure) return;
  G.chaseCD -= dt;
  if (G.chaseCD > 0) return;
  G.chaseCD = rnd(1.0, 2.2);
  const lz = zoneOf(G.lure.y);
  const prefs = LURE_PREF[LURES[S.tIdx].id];
  const w = {};
  const paused = G.phase === 'sink' && G.pauseT > 0.7;
  for (const id in prefs) {
    const sp = fishById(id);
    if (!zoneOk(sp, lz)) continue;
    let v = prefs[id] * (sp.zone === lz ? 1.4 : 0.8);
    if (paused) v *= (id === 'pike' ? 3.5 : 0.35);
    w[id] = v;
  }
  if (!Object.keys(w).length) return;
  if (Math.random() > 0.62) return;
  const sp = fishById(wpick(w));
  const side = G.lure.x > 130 ? 1 : -1;
  G.chase = {
    sp,
    x: clamp(G.lure.x + side * rnd(38, 66), 10, 310),
    y: clamp(G.lure.y + rnd(-8, 8), 92, 204),
    t: 0
  };
}
function updChase(dt) {
  const c = G.chase, L = G.lure;
  if (!c || !L) return;
  c.t += dt;
  const d = Math.max(0.5, dist(c.x, c.y, L.x, L.y));
  const spd = (22 + c.sp.pull * 5) * (d < 12 ? 1.45 : 1);
  c.x += (L.x - c.x) / d * spd * dt;
  c.y += (L.y - c.y) / d * spd * dt + Math.sin(c.t * 6) * 0.2;
  if (L.x > PIV.x - 40) { G.chase = null; return; }
  if (d < 4.5) {
    addSplash(L.x, L.y, true); addRipple(L.x, Math.max(88, L.y - 6), 9); SND.bite();
    G.phase = 'strike'; G.strikeT = 0.95;
  }
}
function hookSpin() {
  if (!G.chase || !G.lure) return;
  const sp = G.chase.sp;
  const spot = { x: G.lure.x, y: G.lure.y };
  addSplash(spot.x, spot.y, true); addRipple(spot.x, Math.max(88, spot.y - 6), 10);
  G.chase = null;
  SND.hook();
  fightInit(sp, spot);
}

/* ---------------- ВИВАЖУВАННЯ ---------------- */
function fightTip() {
  if (G.fight && G.fight.src && G.fight.src !== 'held') return standTipOf(G.fight.src);
  return rodTipPos();
}
function fightInit(sp, spot, src) {
  src = src || 'held';
  const tip = src === 'held' ? rodTipPos() : standTipOf(src);
  const wt = sp.w[0] + (sp.w[1] - sp.w[0]) * Math.pow(Math.random(), 1.7);
  const D0 = Math.max(40, dist(tip.x, tip.y, spot.x, spot.y));
  const pmBase = src === 'float' ? 0.75 : 1;
  if (G.fly) G.fly = null;
  // спінінг пам'ятає свій стан: після виважування ставної вудки проводка триває
  if (G.phase === 'sink' || G.phase === 'reel') G.spinBack = G.phase;
  else if (G.phase === 'strike') G.spinBack = 'sink';
  G.fight = {
    sp, wt, D: D0, D0, S: 100, T: 6, src,
    pull: false, pT: rnd(0.3, 0.8),
    sx: spot.x, sy: spot.y, hop: 0, tired: false, thr: rnd(0, 9),
    pm: pmBase * (0.6 + 0.4 * wt / sp.w[1]) * curRod().pullMul,
    lineStr: curLine().str,
    price: Math.max(1, Math.round(sp.ppk * wt))
  };
  G.phase = 'fight';
}
function fishPos() {
  const f = G.fight, tip = fightTip();
  const frac = f.D / f.D0;
  let x = tip.x + (f.sx - tip.x) * frac;
  let y = tip.y + (f.sy - tip.y) * frac;
  const len = Math.max(1, dist(tip.x, tip.y, f.sx, f.sy));
  const nx = -(f.sy - tip.y) / len, ny = (f.sx - tip.x) / len;
  const off = Math.sin(f.thr * 13) * (f.pull ? 2.6 : 1.2);
  x += nx * off; y += ny * off;
  if (f.hop > 0) y -= Math.sin(Math.PI * f.hop / 0.35) * 6;
  return { x, y };
}
function updFight(dt) {
  const f = G.fight;
  f.thr += dt;
  f.pT -= dt;
  if (f.pT <= 0 && !f.tired) {
    f.pull = !f.pull;
    f.pT = f.pull ? rnd(0.5, 1.2) * f.pm : rnd(0.6, 1.1);
    if (f.pull) SND.run();
  }
  if (f.tired) f.pull = false;
  const held = mouseHeld || (autoActive() && G.autoHold === true);
  if (held) {
    f.D -= (f.pull ? 7 : 24) * dt;
    f.T += (f.pull ? 24 + 16 * f.pm : 7) * dt / (f.lineStr || 1);
    G.reelT -= dt; if (G.reelT <= 0) { SND.reel(); G.reelT = 0.09; }
  } else {
    f.T -= 26 * dt;
    if (f.pull) f.D += (8 + 7 * f.pm) * dt;
  }
  f.D = clamp(f.D, 22, f.D0 + 45);
  f.T = clamp(f.T, 0, 100);
  if (f.pull && !f.tired) f.S -= (held ? (8 + f.wt * 0.9) : 4) * dt;
  else if (!f.pull) f.S += 2.5 * dt;
  f.S = clamp(f.S, 0, 100);
  if (f.S <= 0 && !f.tired) {
    f.tired = true; f.pull = false;
    setMsg('РИБА ВТОМИЛАСЬ! ТЯГНИ!', '#7be08a', 2); SND.tired();
  }
  if (f.T >= 100) {
    const p = fishPos();
    SND.snap(); addSplash(p.x, p.y, true);
    setMsg('ОБРІВ ЛІСКА! РИБА ПІШЛА', '#ff5a4a', 2.2);
    const src = f.src;
    G.fight = null;
    if (src === 'held') { G.lure = null; G.float = null; G.phase = 'idle'; G.spinBack = null; }
    else {
      // ставна вудка лишається стояти, спінінг продовжує проводку
      const st = S.stand[src];
      if (st && st.float) { st.float.y = st.float.baseY; st.float.x = st.float.baseX; st.float.tilt = 0; st.phase = 'wait'; scheduleStand(src); }
      G.phase = (G.spinBack && G.lure) ? G.spinBack : 'idle';
      G.spinBack = null;
    }
    return;
  }
  if (f.pull && Math.random() < dt * 0.7) { f.hop = 0.35; const p = fishPos(); addSplash(p.x, p.y, false); }
  f.hop = Math.max(0, f.hop - dt);
  if (f.D <= 24) {
    let sold = false;
    if (invTotal() >= MAX_FISH) { sold = true; S.money += f.price; } // склад повний - автопродаж
    else {
      const inv = S.inv[f.sp.id] || (S.inv[f.sp.id] = { n: 0, kg: 0, val: 0 });
      inv.n++; inv.kg += f.wt; inv.val += f.price;
    }
    if (S.comp && S.comp.active && f.sp.id === S.comp.target) { S.comp.myScore++; compSend({ t: 'score', n: S.comp.myScore }); }
    if (S.coop && S.coop.active) {
      S.coop.myFish = (S.coop.myFish || 0) + 1; S.coop.myWt = (S.coop.myWt || 0) + f.wt;
      compSend({ t: 'catch', n: f.sp.name, w: f.wt });
    }
    save();
    addSplash(f.sx, f.sy, true); addRipple(f.sx, f.sy, 12);
    SND.catchF();
    G.show = { sp: f.sp, wt: f.wt, price: f.price, t: 2.8, sold };
    G.showSrc = f.src;
    G.fight = null;
    if (f.src === 'held') { G.lure = null; G.float = null; }
    G.phase = 'show';
  }
}

/* ---------------- клік у грі ---------------- */
function gameClick(x, y) {
  // підсічка на ставній вудці: клік по поплавку / годівниці
  if (!G.fight && G.phase !== 'show') {
    for (const kind of ['float', 'feeder']) {
      const st = S.stand[kind];
      if (st && st.bite && st.float && dist(x, y, st.float.x, st.float.y) < 16) { hookStand(kind); return; }
    }
  }
  const ph = G.phase;
  if (S.mode === 'float' || S.mode === 'feeder') {
    if (ph === 'idle' || ph === 'sinkBait') { if (inWater(x, y)) cast(x, y); }
    else if (ph === 'wait') {
      if (G.bite) hookFloat();
      else if (G.nib) tooEarly();
      else if (inWater(x, y)) cast(x, y);
      else { G.phase = 'idle'; G.float = null; setMsg('ОСНАСТКУ ВИТЯГНУТО'); }
    }
  } else {
    if (ph === 'idle') { if (inWater(x, y)) cast(x, y); }
    else if (ph === 'sink' || ph === 'reel') {
      if (!inWater(x, y)) { G.lure = null; G.chase = null; G.phase = 'idle'; setMsg('ПРОВОДКУ ЗАВЕРШЕНО'); }
    }
    else if (ph === 'strike') hookSpin();
  }
}

/* ---------------- СЕКРЕТНА АВТОЛОВЛЯ (пін-код 1111 у магазині) ---------------- */
function autoActive() { return !!(S.autoUnlocked && S.autoOn); }
function autoHeld() { return autoActive() && G.autoHold === true; }

/* ---------------- оновлення ---------------- */
function updRod(dt) {
  let target = -2.3;
  if (pt.x > 0) {
    const t = Math.atan2(pt.y - PIV.y, pt.x - PIV.x);
    target = clamp(t, -2.95, -1.72);
  }
  let strain = 0;
  if (G.phase === 'fight' && G.fight && G.fight.src === 'held') strain = -0.05 - 0.12 * (G.fight.T / 100);
  else if (G.phase === 'reel') strain = -0.04;
  else if (S.mode === 'feeder' && G.phase === 'wait') {
    // покльовка на фідер: квівертип згинається
    if (G.bite) strain = -0.20 + Math.sin(G.t * 16) * 0.05;
    else if (G.tipWig > 0) { strain = -0.05 + Math.sin(G.t * 34) * 0.045; G.tipWig -= dt; }
  }
  target += strain;
  rodAng += (target - rodAng) * Math.min(1, dt * 10);
}

function update(dt) {
  if (S.scr !== 'game') return;
  if (S.paused || S.invOpen || S.shopOpen || S.tradeOpen || S.floatEditOpen) return;
  if (S.comp && S.comp.active) {
    S.comp.t -= dt;
    if (S.comp.t <= 0) { S.comp.t = 0; S.comp.active = false; S.comp.finished = true; }
  }
  G.t += dt;
  updRod(dt);
  updAmb(dt);
  updFx(dt);
  if (G.msg) { G.msg.t -= dt; if (G.msg.t <= 0) G.msg = null; }

  // автоловля: гра сама закидає, веде проводку, підсікає і виважує
  if (autoActive()) {
    if (G.phase === 'sink' || G.phase === 'reel') {
      G.autoHoldT = (G.autoHoldT || 0) - dt;
      if (G.autoHoldT <= 0) { G.autoHold = !G.autoHold; G.autoHoldT = G.autoHold ? rnd(0.8, 1.5) : rnd(0.45, 0.95); }
    }
    if (G.phase === 'fight' && G.fight) {
      const f = G.fight;
      G.autoHold = f.tired ? true : (f.T > 86 ? false : !f.pull);
    }
    if (G.phase === 'idle' && !G.fight) {
      G.autoCastT = (G.autoCastT || 0) + dt;
      if (G.autoCastT > 0.9) { G.autoCastT = 0; const c = clampCast(rnd(40, 250), rnd(112, 196)); cast(c.x, c.y); }
    }
    if (G.phase === 'strike') {
      G.autoStrikeT = (G.autoStrikeT || 0) + dt;
      if (G.autoStrikeT > 0.3) { G.autoStrikeT = 0; hookSpin(); }
    }
    if (G.phase === 'wait' && G.bite) {
      G.bite.autoT = (G.bite.autoT || 0) + dt;
      if (G.bite.autoT > 0.5) hookFloat();
    }
  }

  if (G.phase === 'fly') {
    G.fly.t += dt / G.fly.dur;
    if (G.fly.t >= 1) landFly();
  }
  else if (G.phase === 'sinkBait') {
    G.float.t += dt;
    if (S.mode === 'feeder') G.float.y += (G.float.baseY - G.float.y) * Math.min(1, dt * 2.0);
    else G.float.y = G.float.baseY + Math.sin(G.float.t * 2.2) * 1;
    G.baitY += (G.rigY - G.baitY) * Math.min(1, dt * 2.2);
    G.sinkT -= dt;
    if (G.sinkT <= 0) { G.baitY = G.rigY; G.float.y = G.float.baseY; G.phase = 'wait'; }
  }
  else if (G.phase === 'wait') {
    const fl = G.float;
    const isF = S.mode === 'feeder';
    fl.t += dt;
    if (G.bite) {
      // покльовка: поплавок пішов під воду / фідер зігнувся
      G.bite.t -= dt;
      if (isF) { G.tipWig = 0.2; if (Math.random() < dt * 3) addRipple(fl.x, 86, 5); }
      else {
        fl.y = fl.baseY + 7;
        fl.tilt = 0.55;
        fl.x -= dt * 2;
        if (Math.random() < dt * 3) addRipple(fl.x, fl.baseY, 5);
      }
      if (G.bite.t <= 0) {
        // не встиг
        fl.y = fl.baseY; fl.tilt = 0;
        addSplash(fl.x, isF ? 88 : fl.baseY, false);
        setMsg('РИБА ПІШЛА...', '#ffb050', 1.6);
        if (Math.random() < 0.5) setMsg('НАЖИВКУ ЗІРВАНО!', '#ffb050', 1.8);
        G.bite = null;
        scheduleBite();
      }
    } else if (G.nib) {
      const nb = G.nib;
      nb.t += dt;
      if (nb.done < nb.seq.length && nb.t >= nb.seq[nb.done]) {
        nb.done++;
        SND.nibble();
        if (isF) { G.tipWig = 0.3; addRipple(fl.x, 86, 4); }
        else fl.dipT = 0.25;
      }
      if (isF) { fl.y = fl.baseY + Math.sin(fl.t * 2) * 0.6; }
      else {
        fl.dipT = Math.max(0, fl.dipT - dt);
        fl.y = fl.baseY + (fl.dipT > 0 ? 1.5 : 0) + Math.sin(fl.t * 2) * 1;
        fl.tilt = fl.dipT > 0 ? 0.22 * (nb.done % 2 ? 1 : -1) : 0;
      }
      if (nb.done >= nb.seq.length && nb.t > nb.seq[nb.seq.length - 1] + 0.55) {
        // кінець потяжок: клює чи ні?
        if (Math.random() < 0.55) {
          G.bite = { t: 1.15 };
          G.nib = null;
          SND.bite();
        } else {
          G.nib = null;
          if (G.nextFish.id === 'ruff' || Math.random() < 0.3) {
            setMsg('НАЖИВКУ ЗІРВАНО! НАСМАЖ НОВУ', '#ffb050', 1.8);
          }
          scheduleBite();
        }
      }
    } else {
      fl.y = fl.baseY + Math.sin(fl.t * 2) * 1;
      fl.tilt = 0;
      G.biteTimer -= dt;
      if (G.biteTimer <= 0) startNibble();
    }
  }
  else if (G.phase === 'sink') {
    G.lure.y = Math.min(206, G.lure.y + LURES[S.tIdx].sink * dt);
    G.pauseT += dt;
    G.wig += dt * 3;
    if (mouseHeld || autoHeld()) { G.phase = 'reel'; }
    else {
      tryChase(dt);
      if (G.chase) updChase(dt);
    }
  }
  else if (G.phase === 'reel') {
    const L = LURES[S.tIdx];
    G.lure.x += L.retr * dt;
    G.wig += dt * 11;
    G.lure.y += Math.sin(G.wig * 2) * 0.12;
    G.pauseT = 0;
    G.reelT -= dt; if (G.reelT <= 0) { SND.reel(); G.reelT = 0.09; }
    if (!mouseHeld && !autoHeld()) G.phase = 'sink';
    if (G.lure.x > PIV.x - 26) {
      G.lure = null; G.chase = null; G.phase = 'idle';
      setMsg('ПРОВОДКУ ЗАВЕРШЕНО - ЗАКИНУЙ ЗНОВУ');
    } else {
      tryChase(dt);
      if (G.chase) updChase(dt);
    }
  }
  else if (G.phase === 'strike') {
    G.strikeT -= dt;
    if (G.chase && G.lure) {
      G.chase.x += Math.sin(G.t * 20) * 0.3;
      G.chase.y = G.lure.y + Math.sin(G.t * 10) * 1.5;
    }
    if (G.strikeT <= 0) {
      G.chase = null;
      G.chaseCD = rnd(2, 3.5);
      setMsg('МІМО! РИБА ВІДСТУПИЛА', '#ffb050', 1.5);
      SND.miss();
      G.phase = mouseHeld ? 'reel' : 'sink';
    }
  }
  else if (G.phase === 'fight') {
    updFight(dt);
  }
  else if (G.phase === 'show') {
    G.show.t -= dt;
    if (G.show.t <= 0) {
      const src = G.showSrc;
      G.show = null; G.showSrc = null;
      if (src && src !== 'held') {
        // ставна вудка лишається стояти і одразу чекає наступної покльовки
        const st = S.stand[src];
        if (st) { if (st.float) { st.float.y = st.float.baseY; st.float.x = st.float.baseX; st.float.tilt = 0; } st.phase = 'wait'; scheduleStand(src); }
        G.phase = (G.spinBack && G.lure) ? G.spinBack : 'idle';
        G.spinBack = null;
      } else { G.phase = 'idle'; G.spinBack = null; }
    }
  }
  // ставні вудки живуть своїм життям, поки ти ловиш спінінгом
  updStand('float', dt);
  updStand('feeder', dt);
}

/* ---------------- підказки ---------------- */
function tipText() {
  if (G.phase === 'idle') return 'КЛАЦНИ ПО ВОДІ - ЗАКИНУТИ СПІНІНГ. 1-2: ПОСТАВИТИ ВУДКИ';
  if (G.phase === 'fly') return 'ЗАКИДУВАННЯ...';
  if (G.phase === 'sink') return 'ТРИМАЙ ЛКМ - ПРОВОДКА. ПАУЗА - СТУПІНЬ';
  if (G.phase === 'reel') return 'ПРОВОДКА! ПАУЗИ ПРОВОКУЮТЬ ЩУКУ';
  if (G.phase === 'strike') return '';
  if (G.phase === 'fight') return 'ТРИМАЙ ЛКМ - ТЯГНЕШ, ВІДПУСТИ - ВІДДАЙ ЛІСКУ';
  return '';
}

  panel(90, 2, 140, 16);
  const mm = Math.floor(c.t / 60), ss = Math.floor(c.t % 60);
  drawText('ЩУКОЛОВ ' + mm + ':' + (ss < 10 ? '0' : '') + ss, 96, 6, 1, '#ffd54a');
  panel(90, 60, 140, 24);
  drawText('ТИ: ' + c.myScore + '  СУПЕРНИК: ' + c.oppScore, 96, 65, 1, '#e8f0f0');
  drawText('ЩУКА = ОЧКО', 96, 75, 1, '#8aa8b0');
  if (c.finished) {
    ctx.fillStyle = 'rgba(4,14,20,0.65)'; ctx.fillRect(0, 0, VW, VH);
    panel(66, 70, 188, 96);
    const win = c.myScore > c.oppScore ? 'ТИ ПЕРЕМІГ!' : c.myScore < c.oppScore ? 'ТИ ПРОГРАВ' : 'НІЧИЯ';
    drawText(win, 160, 80, 2, c.myScore >= c.oppScore ? '#6ac86a' : '#ff5a4a', 'center');
    drawText('ТИ: ' + c.myScore + '   СУПЕРНИК: ' + c.oppScore, 160, 104, 1, '#e8f0f0', 'center');
    btn(110, 130, 100, 20, 'ЗАВЕРШИТИ', () => {
      netDisconnect();
      S.comp = null; S.coop = null; clearStands(); S.scr = 'title'; resetFishing(); save(); SND.ui();
    }, 1);
  }
}
function drawShow(now) {
  const s = G.show;
  ctx.fillStyle = 'rgba(4,14,20,0.55)'; ctx.fillRect(0, 0, VW, VH);
  panel(66, 54, 188, 124);
  drawText('СПІЙМАНО!', 160, 62, 2, '#ffd54a', 'center');
  const sc = s.sp.len >= 15 ? 4 : 5;
  blit(s.sp.spr.frames[(now / 150 | 0) % 2], 160, 100, sc, false);
  drawText(s.sp.name, 160, 122, 1, '#e8f0f0', 'center');
  drawText('ВАГА: ' + s.wt.toFixed(2) + ' КГ', 160, 134, 1, '#c8d8dc', 'center');
  drawText('ЦІНА: $' + s.price, 160, 146, 1, '#ffd54a', 'center');
  drawText(s.sold ? 'СКЛАД БУВ ПОВНИЙ - ПРОДАНО АВТОМАТИЧНО' : 'РИБА НА СКЛАДІ (КНОПКА СКЛАД АБО I)', 160, 162, 1, '#6a8a94', 'center');
}
function drawGame(now) {
  drawBG();
  ctx.fillStyle = 'rgba(8,26,38,0.15)';
  ctx.fillRect(0, 84, VW, 132);
  for (const a of G.amb) {
    blit(a.sp.spr.frames[(now / 180 | 0) % 2], a.x, a.y, 1, a.dir > 0);
  }
  drawFx();
  if (G.chase && G.lure) {
    blit(G.chase.sp.spr.frames[(now / 110 | 0) % 2], G.chase.x, G.chase.y, 1.5, G.lure.x > G.chase.x);
  }
  drawTackleOnWater(now);
  drawStands(now);
  drawLineNow();
  drawRod();
  if (G.phase === 'fight' && G.fight) {
    const p = fishPos();
    blit(G.fight.sp.spr.frames[(now / 80 | 0) % 2], p.x, p.y, 1.5, Math.sin(G.fight.thr * 5) > 0);
  }
  drawHud(now);
  if (G.show) drawShow(now);
}

/* ---------------- головний цикл ---------------- */
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000) || 0.016;
  last = ts;
  clicks = [];
  update(dt);
  if (S.scr === 'title') { drawBG(); drawTitle(ts); }
  else if (S.scr === 'pick') { drawBG(); drawPick(ts); }
  else if (S.scr === 'tackle') { drawBG(); drawTackle(ts); }
  else if (S.scr === 'gear') { drawBG(); drawGear(ts); }
  else if (S.scr === 'online') { drawBG(); drawOnline(ts); }
  else if (S.scr === 'floats') { drawBG(); drawFloats(ts); }
  else {
    drawGame(ts);
    if (S.invOpen) drawInv();
    if (S.paused) drawPause();
  }
  if (S.shopOpen) drawShop();
  if (S.tradeOpen) drawTrade();
  if (S.floatEditOpen) drawFloatEdit();
  drawCursor();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* дебаг-гачки для тестування */
window.__dbg = {
  S, G,
  cast: (x, y) => { if (S.scr === 'game') cast(clampCast(x, y).x, clampCast(x, y).y); },
  strike: () => { if (G.lure) { G.chase = { sp: fishById('pike'), x: G.lure.x + 8, y: G.lure.y, t: 0 }; G.phase = 'strike'; G.strikeT = 0.95; } },
  fight: (id) => { if (S.scr === 'game') fightInit(fishById(id || 'pike'), { x: 160, y: 150 }); },
  catchFish: (id) => { if (S.scr === 'game') { fightInit(fishById(id || 'perch'), { x: 160, y: 150 }); G.fight.D = 24; } },
  stand: (k) => { if (S.scr === 'game') placeStand(k || 'float', true); },
  biteStand: (k) => { const st = S.stand[k || 'float']; if (st) { st.biteTimer = 0.01; } },
  auto: (on) => { S.autoUnlocked = true; S.autoOn = on === undefined ? true : !!on; },
  pinLock: () => { S.autoUnlocked = false; S.autoOn = false; S.pinBuf = ''; save(); },
  go: (scr) => { S.scr = scr; if (scr === 'game') { S.mode = 'spin'; S.tIdx = S.tIdxSpin || 0; initGame(); } }
};

</script>
